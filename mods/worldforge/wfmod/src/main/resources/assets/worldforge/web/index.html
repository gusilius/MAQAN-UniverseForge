<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorldForge: карта</title>
<style>
/* Оформление: структура и режимы как в картах Paradox (CK3), материалы как в интерфейсе Minecraft:
   панель режимов - «хотбар», подсказки - как предметы, рамки со скосом, тень под текстом. */
:root{
  --bg:#0b0e14;
  --stone:#2a2a2f;--stone2:#1d1d21;--hi:#5d5d66;--lo:#0c0c0e;
  --gold:#f0c85a;--gold2:#a8842a;--tx:#ecebe4;--mut:#a6a8b3;--ok:#7be06a;
  --font:"Minecraft","Press Start 2P",ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:none;font-smooth:never}
.sh{text-shadow:1px 1px 0 #000}
/* рамка со скосом: светлый верх-лево, тёмный низ-право */
.bev{background:var(--stone);border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:0 0 0 2px #000,0 6px 18px rgba(0,0,0,.55)}
.bev.in{background:var(--stone2);border-color:var(--lo) var(--hi) var(--hi) var(--lo);box-shadow:none}

#view{position:absolute;inset:0;cursor:grab;touch-action:none}
#view.drag{cursor:grabbing}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:auto}

/* верх слева: табличка с названием мира */
#plate{position:absolute;left:14px;top:14px;padding:8px 16px 8px 12px;z-index:6;display:flex;align-items:center;gap:10px;max-width:46vw}
#plate .nm{font-size:15px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#plate .sb{font-size:11px;color:var(--mut)}
#plate canvas{image-rendering:pixelated;width:28px;height:28px;flex:none}

/* верх справа: поиск и кнопки */
#tools{position:absolute;right:14px;top:14px;z-index:6;display:flex;gap:6px;align-items:center}
#search{background:var(--stone2);color:var(--tx);border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);padding:7px 10px;font:inherit;width:220px;outline:none;box-shadow:0 0 0 2px #000}
#search:focus{border-color:#000 var(--gold) var(--gold) #000}
.tb{width:38px;height:38px;display:grid;place-items:center;cursor:pointer;background:var(--stone);border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:0 0 0 2px #000;color:var(--tx);padding:0;position:relative}
.tb:hover{background:#3a3a42}
.tb:active,.tb.on{background:var(--stone2);border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
.tb.on{color:var(--gold)}
.tb svg{width:20px;height:20px;shape-rendering:crispEdges;fill:currentColor}
.tb[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:46px;right:0;white-space:nowrap;background:rgba(16,0,16,.95);border:2px solid #2a0a60;padding:3px 7px;color:#fff;font-size:12px;z-index:20;text-shadow:1px 1px 0 #000;pointer-events:none}

/* низ по центру: «хотбар» режимов карты */
#hotbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;display:flex;gap:4px;padding:5px;max-width:96vw;overflow-x:auto}
.slot{width:54px;height:54px;flex:none;position:relative;cursor:pointer;background:var(--stone2);border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);display:grid;place-items:center;padding:0;color:var(--tx);font:inherit}
.slot canvas{width:32px;height:32px;image-rendering:pixelated}
.slot .n{position:absolute;left:3px;top:1px;font-size:10px;color:var(--mut);text-shadow:1px 1px 0 #000}
.slot:hover{background:#2c2c34}
.slot.on{outline:3px solid #fff;outline-offset:1px;background:#33333c;z-index:2}
.slot.on::after{content:"";position:absolute;inset:-5px;border:2px solid #000;pointer-events:none}
#modeName{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);z-index:6;background:rgba(16,0,16,.92);border:2px solid #2a0a60;padding:3px 12px;color:#fff;white-space:nowrap;text-shadow:1px 1px 0 #000;pointer-events:none;opacity:0;transition:opacity .25s}
#modeName.show{opacity:1}

/* низ слева: координаты, низ справа: масштаб */
#coords:empty{display:none}
#coords{position:absolute;left:14px;bottom:16px;z-index:6;padding:5px 10px;font-size:12px;color:var(--mut)}
#coords b{color:var(--tx);font-weight:normal}
#scale{position:absolute;right:14px;bottom:16px;z-index:6;padding:6px 10px 5px;font-size:11px;color:var(--mut);text-align:right;min-width:90px}
#scale i{display:block;height:6px;border:2px solid var(--tx);border-top:0;margin:3px 0 0 auto}
#compass{position:absolute;right:14px;bottom:70px;z-index:5;width:54px;height:54px;image-rendering:pixelated;opacity:.9}

/* подсказка при наведении: как у предмета Minecraft */
#tip{position:absolute;pointer-events:none;background:rgba(16,0,16,.95);border:2px solid #2a0a60;box-shadow:0 0 0 2px #100010;padding:6px 10px;z-index:30;display:none;max-width:320px;font-size:12px}
#tip .h{color:#fff;font-size:13px;margin-bottom:2px}
#tip .t{color:#aaa}
#tip .t b{color:#fff;font-weight:normal}
.cd{display:inline-block;width:9px;height:9px;border:1px solid #000;margin-right:5px;vertical-align:-1px}

/* карточка титула (слева) */

#drawer .hd{display:flex;gap:12px;padding:12px 12px 10px;align-items:center;border-bottom:2px solid #000}
#drawer .hd svg{width:44px;height:52px;flex:none;filter:drop-shadow(2px 2px 0 #000)}
#drawer h2{margin:0;font-size:16px;color:var(--gold);font-weight:normal;line-height:1.2}
#drawer .sub{color:var(--mut);font-size:11px;margin-top:3px}
#drawer .bd{padding:8px 12px 12px}
#drawer .sec{color:var(--gold2);font-size:11px;margin:10px 0 3px;text-transform:uppercase;letter-spacing:.08em}
#drawer .row{display:flex;gap:8px;align-items:center;padding:2px 0}
#drawer .k{color:var(--mut);width:104px;flex:none;font-size:11px}
#drawer a{color:var(--tx);cursor:pointer;text-decoration:underline dotted}
#drawer a:hover{color:var(--gold)}
#drawer .tree{border-left:2px solid #000;margin-left:5px;padding-left:10px}
#drawer .btns{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.btn{background:var(--stone);border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:0 0 0 2px #000;color:var(--tx);font:inherit;font-size:11px;padding:5px 9px;cursor:pointer}
.btn:hover{background:#3a3a42;color:var(--gold)}
.btn:active{background:var(--stone2);border-color:var(--lo) var(--hi) var(--hi) var(--lo)}

/* список титулов (слева, под карточкой скрывается) */
#list{padding:2px}
#list .hd{color:var(--gold);padding:4px 6px 6px;border-bottom:2px solid #000;margin-bottom:4px}
#list .it{display:flex;gap:8px;align-items:center;padding:3px 6px;cursor:pointer}
#list .it:hover{background:#3a3a42}
#list .sw{width:12px;height:12px;border:1px solid #000;flex:none}
#list .ar{margin-left:auto;color:var(--mut);font-size:11px}

/* слои (справа) */
#layers{padding:2px}
#layers h3{margin:0 0 6px;font-size:12px;color:var(--gold);font-weight:normal;text-transform:uppercase;letter-spacing:.08em}
.tg{display:flex;align-items:center;gap:8px;margin:5px 0;cursor:pointer;user-select:none}
.tg .box{width:16px;height:16px;background:var(--stone2);border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);display:grid;place-items:center;flex:none}
.tg input{display:none}
.tg input:checked+.box::after{content:"";width:8px;height:8px;background:var(--ok)}
.rg{margin:8px 0 2px}
.rg label{display:flex;justify-content:space-between;color:var(--mut);font-size:11px}
input[type=range]{width:100%;accent-color:var(--gold);margin:3px 0}
#help{position:absolute;inset:0;z-index:40;display:none;place-items:center;background:rgba(0,0,0,.55)}
#help .bev{padding:16px 22px;max-width:520px}
#help h3{margin:0 0 8px;color:var(--gold);font-weight:normal}
#help kbd{background:var(--stone2);border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);padding:0 6px;margin-right:6px}
#toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);z-index:50;background:rgba(16,0,16,.95);border:2px solid #2a0a60;padding:5px 12px;display:none}
/* обзорная миниатюра с рамкой вида (как обзор в CK3) */
#ovw{position:absolute;right:14px;bottom:56px;z-index:6;padding:5px;display:block}
#ovw canvas{display:block;image-rendering:auto;cursor:pointer;border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
#compass{right:auto;bottom:auto;left:auto}
/* легенда режима */
#legend{position:absolute;left:14px;bottom:58px;width:230px;max-height:34vh;overflow:auto;z-index:5;display:none;padding:8px 10px}
#legend .hd{color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;padding-bottom:4px;border-bottom:2px solid #000}
#legend .it{display:flex;align-items:center;gap:7px;padding:2px 0;cursor:pointer;font-size:12px}
#legend .it:hover{color:var(--gold)}
#legend .sw{width:14px;height:14px;border:2px solid #000;flex:none}
#legend .ar{margin-left:auto;color:var(--mut);font-size:11px}

/* боковая панель: рейка вкладок справа и выезжающий ящик слева от неё */
#rail{position:absolute;right:14px;top:66px;z-index:8;display:flex;flex-direction:column;gap:6px}
#rail .tb{width:40px;height:40px}
#rail .tb.on{background:var(--stone2);color:var(--gold);box-shadow:0 0 0 2px #000,-4px 0 0 2px var(--gold2)}
#drawer{position:absolute;right:64px;top:66px;width:350px;bottom:285px;z-index:7;display:flex;flex-direction:column;transform:translateX(calc(100% + 80px));opacity:0;pointer-events:none;transition:transform .22s ease,opacity .18s}
#drawer.open{transform:none;opacity:1;pointer-events:auto}
#drawer .dh{display:flex;align-items:center;padding:7px 10px 6px;border-bottom:2px solid #000;color:var(--gold);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
#drawer .dh span{flex:1}
#drawer .pane{display:none;overflow:auto;padding:10px 12px 14px;flex:1;min-height:0}
#drawer .pane.on{display:block}
.empty{color:var(--mut);padding:14px 2px;line-height:1.5}
.chipl{display:inline-block;padding:0 6px;border:2px solid #000;background:var(--stone2);color:var(--mut);font-size:10px;margin-left:6px;vertical-align:1px}
.chipl.op{color:var(--gold)}
.tr{padding:2px 0}
.tr .nm{cursor:pointer}
.tr .nm:hover{color:var(--gold)}
.tr.cur>.nm{color:var(--gold)}
.tr .ch{border-left:2px solid #000;margin-left:6px;padding-left:10px}
.act{padding:6px 0;border-bottom:2px solid #000}
.act .hn{color:var(--mut);font-size:11px;margin-top:2px}
.kv{display:flex;gap:8px;padding:2px 0}
.kv .k{color:var(--mut);width:110px;flex:none;font-size:11px}
.kv .v{word-break:break-word}
/* разделители групп в хотбаре */
.sep{width:6px;flex:none;align-self:stretch;background:linear-gradient(90deg,#000 0 2px,var(--hi) 2px 4px,transparent 4px);opacity:.7;margin:0 2px}
.slot .g{position:absolute;right:3px;bottom:1px;font-size:9px;color:var(--gold);text-shadow:1px 1px 0 #000}
@media (max-width:760px){#search{width:130px}#drawer{width:calc(100% - 130px);bottom:130px}#ovw{display:none}#legend{display:none!important}#coords{display:none}.slot{width:44px;height:44px}.slot canvas{width:26px;height:26px}#modeName{bottom:80px}}
.ph{display:flex;gap:12px;align-items:center;padding-bottom:8px;border-bottom:2px solid #000}
.ph svg{width:44px;height:52px;flex:none;filter:drop-shadow(2px 2px 0 #000)}
.ph h2{margin:0;font-size:16px;color:var(--gold);font-weight:normal;line-height:1.2}
.ph .sub{color:var(--mut);font-size:11px;margin-top:3px}
#drawer .sec{color:var(--gold2);font-size:11px;margin:12px 0 3px;text-transform:uppercase;letter-spacing:.08em}
#drawer a{color:var(--tx);cursor:pointer;text-decoration:underline dotted}
#drawer a:hover{color:var(--gold)}
.mk{display:flex;gap:8px;align-items:center;padding:3px 2px;cursor:pointer}
.mk:hover{background:#3a3a42}
.mk .co{margin-left:auto;color:var(--mut);font-size:11px}
</style>
</head>
<body>
<div id="view"><canvas id="cv"></canvas></div>

<div id="plate" class="bev sh"><canvas id="plateIcon" width="12" height="12"></canvas><div><div class="nm" id="ttl">WorldForge</div><div class="sb" id="sub">карта мира</div></div></div>

<div id="tools">
  <input id="search" placeholder="Поиск: титул, государство, метка" autocomplete="off">
  <button class="tb" id="bLayers" data-tip="Слои (L)"><svg viewBox="0 0 10 10"><path d="M5 1l5 2.5L5 6 0 3.5zM1 5.2l4 2 4-2 1 .6L5 8.2 0 5.8zM1 7.4l4 2 4-2 1 .6L5 10.4 0 8z"/></svg></button>
  <button class="tb" id="bList" data-tip="Список титулов (G)"><svg viewBox="0 0 10 10"><path d="M0 1h2v2H0zM3 1h7v2H3zM0 4h2v2H0zM3 4h7v2H3zM0 7h2v2H0zM3 7h7v2H3z"/></svg></button>
  <button class="tb" id="bRuler" data-tip="Линейка (R)"><svg viewBox="0 0 10 10"><path d="M0 6l6-6 4 4-6 6zM2 6l1 1 1-1-1-1zM4 4l1 1 1-1-1-1z" fill-rule="evenodd"/></svg></button>
  <button class="tb" id="bPng" data-tip="Сохранить PNG"><svg viewBox="0 0 10 10"><path d="M4 0h2v4h2L5 7 2 4h2zM0 8h10v2H0z"/></svg></button>
  <button class="tb" id="bHelp" data-tip="Клавиши (?)"><svg viewBox="0 0 10 10"><path d="M3 0h4v1h1v3H7v1H5v1h2v1H4V5h1V4h2V1H3v1H1V1h2zM4 8h2v2H4z"/></svg></button>
</div>

<div id="rail"></div>
<div id="drawer" class="bev"><div class="dh"><span id="dTitle">Титул</span><button id="cardX" class="btn" style="padding:0 8px">×</button></div>
  <div class="pane" id="pTitle"><div id="cardC"></div></div>
  <div class="pane" id="pRealm"></div>
  <div class="pane" id="pDip"></div>
  <div class="pane" id="pList"><div id="list"></div></div>
  <div class="pane" id="pLayers"><div id="layers"><h3>Слои карты</h3>
  <label class="tg"><input type="checkbox" data-k="labels" checked><span class="box"></span>Названия</label>
  <label class="tg"><input type="checkbox" data-k="prov"><span class="box"></span>Границы провинций</label>
  <label class="tg"><input type="checkbox" data-k="relief" checked><span class="box"></span>Рельеф под заливкой</label>
  <label class="tg"><input type="checkbox" data-k="markers" checked><span class="box"></span>Метки</label>
  <label class="tg"><input type="checkbox" data-k="players" checked><span class="box"></span>Игроки</label>
  <label class="tg"><input type="checkbox" data-k="grid"><span class="box"></span>Сетка координат</label>
  <label class="tg"><input type="checkbox" data-k="capitals"><span class="box"></span>Столицы</label>
  <div class="rg"><label><span>Прозрачность заливки</span><span id="fillV">100%</span></label><input type="range" id="fillA" min="0" max="100" value="100"></div>
  <div class="rg"><label><span>Размер подписей</span><span id="lblV">100%</span></label><input type="range" id="lblS" min="60" max="160" value="100"></div></div></div>
  <div class="pane" id="pMarks"></div>
</div>
<div id="tip"></div>

<div id="ovw" class="bev"><canvas id="ov"></canvas></div>
<div id="legend" class="bev sh"></div>
<div id="modeName" class="sh"></div>
<div id="hotbar" class="bev in"></div>
<div id="coords" class="bev sh"></div>
<div id="scale" class="bev sh" style="bottom:16px"><span id="scaleT"></span><i id="scaleB"></i></div>
<div id="toast" class="sh"></div>
<div id="help" onclick="this.style.display='none'"><div class="bev sh"><h3>Управление</h3>
<div><kbd>1</kbd>…<kbd>9</kbd> режим карты &nbsp; <kbd>F</kbd> вписать карту</div>
<div><kbd>L</kbd> слои &nbsp; <kbd>G</kbd> список &nbsp; <kbd>R</kbd> линейка</div>
<div><kbd>ЛКМ</kbd> выбрать титул &nbsp; перетаскивание - двигать</div>
<div><kbd>Колесо</kbd> масштаб &nbsp; <kbd>+</kbd><kbd>-</kbd> масштаб</div>
<div><kbd>Esc</kbd> закрыть карточку</div>
<div style="color:var(--mut);margin-top:8px">Подписи крупных держав видны издалека, мелких - при приближении.</div></div></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const view = $("view"), cv = $("cv"), ctx = cv.getContext("2d");
let info, titles = {}, tlist = [], realms = [], realmIdx = {}, prov, terrainData, W, H, maxId = 0;
let terrainCv = null, fillCv = null, provCv = null;
let mode = "terrain", lab = null, version = -1;
let cam = {x: 0, y: 0, z: 1}, fitZ = 1, sel = null, hover = null, markers = [], players = [];
let layers = {labels: true, prov: false, relief: true, markers: true, players: true, grid: false, capitals: false};
let fillAlpha = 1, lblScale = 1, ovl = null;
const TYPE_ICON = {city: "🏙", castle: "🏰", port: "⚓", ruin: "🏚", camp: "⛺", temple: "⛪", mine: "⛏", other: "📍"};
const EDGE = [30, 20, 12];
const initHash = location.hash;

async function jget(u) { const r = await fetch(u); if (!r.ok) throw new Error(u + " " + r.status); return r.json(); }
async function bget(u) { const r = await fetch(u); if (!r.ok) throw new Error(u + " " + r.status); return new Uint8Array(await r.arrayBuffer()); }
function loadImg(u) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = u; }); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }
function hex(c) { return [parseInt(c.substr(1, 2), 16), parseInt(c.substr(3, 2), 16), parseInt(c.substr(5, 2), 16)]; }
function toast(t) { const e = $("toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => e.style.display = "none", 1800); }

// ---------- пиксельные значки режимов (12x12) ----------
const PAL = {k: "#14100c", w: "#e8e2d0", g: "#8d8d96", d: "#55555e", G: "#4f9d3a", L: "#7ed05a", b: "#8a5a2b", B: "#5a98ff", y: "#f0c85a", Y: "#b8902a", r: "#c4413a", R: "#8f2a26", o: "#e08a2e", p: "#a35bd8", s: "#d9c28a"};
const ICONS = {
  terrain: ["............", ".........yy.", "........yyyy", "...w.....yy.", "..wgw.......", "..wggw..w...", ".wggggwwgw..", ".gggggdgggw.", "GLGGGGGGGGGG", "GGGGGGGGGGGG", "bGGGGGGGGGGb", "............"],
  t0: ["............", ".....kk.....", "....krrk....", "...krrrrk...", "..krrrrrrk..", ".krrrrrrrrk.", "..kssssssk..", "..kssbbssk..", "..kssbbssk..", "..kkkkkkkk..", "............", "............"],
  t1: ["............", "..k.k..k.k..", "..kgkkkkgk..", "..kggggggk..", "...kgggggk..", "...kgkkggk..", "...kgkkggk..", "...kgggggk..", "..kkkkkkkkk.", "............", "............", "............"],
  t2: ["............", "..kkkkkkkk..", ".kBBBkRRRRk.", ".kBBBkRRRRk.", ".kBBBkRRRRk.", ".kkkkkkkkkk.", ".kRRRRkBBBk.", "..kRRRkBBk..", "...kRRkBk...", "....kkkk....", "............", "............"],
  t3: ["............", "..k..kk..k..", ".kyk.kyk.kyk", ".kyykkyykyyk", ".kyyyyyyyyk.", ".kyyyyyyyyk.", ".kYYYYYYYYk.", ".kkkkkkkkkk.", "............", "............", "............", "............"],
  t4: ["....kyyk....", "...kyyyyk...", "..k.kyyk.k..", ".kyk.kk.kyk.", ".kyykyykyyk.", ".kyyyyyyyyk.", ".kyrykkyryk.", ".kyyyyyyyyk.", ".kYYYYYYYYk.", ".kkkkkkkkkk.", "............", "............"],

  ctx.restore();
};
$("bPng").onclick = () => { const c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d"); x.drawImage(fillCv || terrainCv, 0, 0); const a = document.createElement("a"); a.download = (info.name + "_" + mode + ".png").replace(/[^\w.-]/g, "_"); a.href = c.toDataURL("image/png"); a.click(); };
$("bHelp").onclick = () => { $("help").style.display = "grid"; };

function writeHash() { if (!info) return; const r = view.getBoundingClientRect(), cx = ((r.width / 2 - cam.x) / cam.z - W / 2) * info.bpp, cz = ((r.height / 2 - cam.y) / cam.z - H / 2) * info.bpp; history.replaceState(null, "", "#" + mode + "," + Math.round(cx) + "," + Math.round(cz) + "," + cam.z.toFixed(2)); }
function readHash() { const h = initHash.slice(1).split(","); if (h.length < 4 || !(h[0] in modeKeys())) return false; const z = parseFloat(h[3]); if (!(z > 0)) return false; setMode(h[0], true); const r = view.getBoundingClientRect(); cam.z = z; cam.x = r.width / 2 - ((parseFloat(h[1]) / info.bpp) + W / 2) * z; cam.y = r.height / 2 - ((parseFloat(h[2]) / info.bpp) + H / 2) * z; draw(); return true; }
let hashT = null; ["wheel"].forEach(ev => view.addEventListener(ev, () => { clearTimeout(hashT); hashT = setTimeout(writeHash, 400); }));

drawIconInto($("plateIcon"), "terrain");
let first = true;
loadAll().then(() => { resize(); if (first) { first = false; readHash(); } setInterval(poll, 3000); }).catch(e => { $("coords").textContent = "ошибка: " + e.message; });
</script>
