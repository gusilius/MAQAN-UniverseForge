modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="worldforge"
    mandatory=true
    versionRange="[0.1,)"
    ordering="AFTER"
    side="BOTH"


[[dependencies.${mod_id}]]
    modId="wf_settle"
    mandatory=false
    versionRange="[0.1,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="wf_army"
    mandatory=false
    versionRange="[0.1,)"
    ordering="AFTER"
    side="BOTH"
