plugins { id 'eclipse'; id 'idea'; id 'maven-publish'; id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
version = '0.1.0-alpha.1'
group = 'dev.maqan.platform'
archivesBaseName = 'maqan-platform'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { workingDirectory project.file('run'); property 'forge.logging.console.level', 'info'; mods { maqan_platform { source sourceSets.main } } }
        server { workingDirectory project.file('run'); property 'forge.logging.console.level', 'info'; mods { maqan_platform { source sourceSets.main } } }
    }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.28'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.withType(Test).configureEach { useJUnitPlatform() }

// Keep source literals deterministic across Linux and Windows runners.
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
