name: MAQAN UI — targeted validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maqan-ui-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-ui-tests:
    name: Platform UI layout tests (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Compile Platform and run focused UI layout tests
        working-directory: platform
        run: >
          gradle --no-daemon test
          --tests "dev.maqan.platform.client.MaqanUiPackAdaptiveLayoutTest"
          --tests "dev.maqan.platform.client.WorkspaceResponsiveLayoutTest"
          --tests "dev.maqan.platform.client.WorkspaceRuntimeTest"
          --tests "dev.maqan.platform.client.PlatformSelectionContextTest"
