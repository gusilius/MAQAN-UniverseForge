name: MAQAN UniverseForge — world runtime acceptance (Windows x64)

on:
  push:
    branches: [main, feature/autonomous-world-simulation-engine, feature/two-planet-runtime-from-2335, feature/native-world-genesis-bootstrap, fix/worldgen-fragmented-polities-and-diverse-genesis, integration/worldgen-rts-unification]
    paths:
      - "mods/worldforge/**"
      - "map.png"
      - "shared/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/universeforge.yml"
  pull_request:
    branches: [main]
    paths:
      - "mods/worldforge/**"
      - "map.png"
      - "shared/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universeforge-world-runtime-acceptance-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  world-runtime-acceptance:
    name: Build once; test vanilla Overworld and image dimension in one server
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image-to-worldmap dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r mods/worldforge/wfaddons/tools/image-worldgen/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Image generation dependencies failed" }

      - name: Test deterministic procedural continents and hydrology
        shell: pwsh
        run: |
          python -m unittest discover -s mods/worldforge/wfaddons/tools/image-worldgen -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Image-worldgen geography tests failed" }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test and build the shared native WorldSim engine
        working-directory: mods/worldforge/native/worldforge-worldsim
        shell: pwsh
        run: |
          cargo test --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "WorldSim native tests failed" }
          cargo build --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "WorldSim native build failed" }

      - name: Run CK3-scale population and political stress gates
        working-directory: mods/worldforge/native/worldforge-worldsim
        shell: pwsh
        run: |
          cargo test --release --target x86_64-pc-windows-msvc scale -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw "100k/500k/1m population or 10k-realm political stress gate failed" }

      - name: Stage native engine into the WorldSim mod
        shell: pwsh
        run: |
          $nativeDir = "mods/worldforge/wfaddons/wf-worldsim/src/main/resources/maqan-native-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $nativeDir | Out-Null
          Copy-Item "mods/worldforge/native/worldforge-worldsim/target/x86_64-pc-windows-msvc/release/worldforge_worldsim.dll" "$nativeDir/worldforge_worldsim.dll" -Force

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.1.1"

      - name: Build WorldForge core and every addon once in dependency order
        working-directory: mods/worldforge/wfaddons
        shell: bash
        run: |
          bash tools/build-all.sh ../wfmod
          test -f dist/worldforge-0.1.jar || find dist -maxdepth 1 -type f -name 'worldforge-*.jar' -print -quit | grep -q .
          addon_count=$(find dist -maxdepth 1 -type f -name 'wf_*.jar' ! -name '*-sources.jar' | wc -l)
          expected_count=$(find . -mindepth 1 -maxdepth 1 -type d -name 'wf-*' | wc -l)
          echo "ADDON_JARS=$addon_count EXPECTED_ADDONS=$expected_count"
          test "$addon_count" -eq "$expected_count"

      - name: Generate the actual image-derived worldmap from map.png
        shell: pwsh
        run: |
          if (!(Test-Path "map.png")) { throw "The repository map.png source is missing" }
          $out = Join-Path $env:RUNNER_TEMP "maqan-world-runtime-map"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $testMap = Join-Path $env:RUNNER_TEMP "maqan-test-map-1000x1000.png"
          python -c "from PIL import Image; Image.open('map.png').convert('RGB').resize((1000,1000), Image.Resampling.LANCZOS).save(r'$testMap')"
          if ($LASTEXITCODE -ne 0) { throw "Could not create the temporary 1000x1000 test-only map" }
          python mods/worldforge/wfaddons/tools/image-worldgen/image_map_analysis.py --input $testMap --output $out --seed 424242
          if ($LASTEXITCODE -ne 0) { throw "Actual map semantic analysis failed" }
          python mods/worldforge/wfaddons/tools/image-worldgen/image_worldgen.py convert --input $testMap --output (Join-Path $out "real-map.worldmap") --seed 424242 --settlement-level 4 --blocks-per-pixel 1
          if ($LASTEXITCODE -ne 0) { throw "Actual map conversion failed" }
          python -c "import sys,json; from pathlib import Path; sys.path.insert(0,'mods/worldforge/wfaddons/tools/image-worldgen'); from image_worldgen import validate_package; print(json.dumps(validate_package(Path(r'$out')/'real-map.worldmap'),ensure_ascii=False,indent=2))"
          if ($LASTEXITCODE -ne 0) { throw "Actual map package validation failed" }

      - name: Run isolated NPC, worldgen, politics, life and integration suites
        working-directory: mods/worldforge/wfaddons
        shell: bash
        run: |
          bash tools/test-all.sh ../wfmod "$RUNNER_TEMP/maqan-world-runtime-map/real-map.worldmap" suite

      - name: Contour 00 — isolated vanilla Server Core lifecycle and same-world recovery
        id: server_core
        continue-on-error: true
        working-directory: mods/worldforge/wfaddons
        shell: bash
        env:
          WF_ACCEPTANCE_MODE: "server-core"
          WF_CORE_OBSERVE_SECONDS: "120"
          WF_RUNTIME_TIMEOUT_SECONDS: "600"
        run: |
          bash tools/world-runtime-smoke.sh vanilla dist "$RUNNER_TEMP/maqan-contour-00-server-core"

      - name: Aggregate Server Core contour result
        if: always()
        shell: pwsh
        env:
          CORE_OUTCOME: ${{ steps.server_core.outcome }}
        run: |
          "CONTOUR_00_SERVER_CORE_OUTCOME=$env:CORE_OUTCOME" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($env:CORE_OUTCOME -ne "success") {
            throw "Contour 00 Server Core failed; inspect the contour artifact."
          }

      - name: Contour 02 — real canonical population, production tick scheduler and durable Character writes
        id: population_stress
        continue-on-error: true
        working-directory: mods/worldforge/wfaddons
        shell: bash
        env:
          WF_ACCEPTANCE_MODE: "population-stress"
          WF_STRESS_ENABLED: "true"
          WF_STRESS_TARGET: "1000000"
          WF_STRESS_BATCH: "128"
          WF_RUNTIME_TIMEOUT_SECONDS: "3600"
        run: |
          bash tools/world-runtime-smoke.sh vanilla dist "$RUNNER_TEMP/maqan-contour-02-population"

      - name: Aggregate Population contour result
        if: always()
        shell: pwsh
        env:
          POPULATION_OUTCOME: ${{ steps.population_stress.outcome }}
        run: |
          "CONTOUR_02_POPULATION_OUTCOME=$env:POPULATION_OUTCOME" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($env:POPULATION_OUTCOME -ne "success") {
            throw "Contour 02 Population failed; inspect the in-game stress report and server evidence."
          }

      - name: Start one server with normal vanilla Overworld and image-derived dimension
        id: dual_world_smoke
        continue-on-error: true
        working-directory: mods/worldforge/wfaddons
        shell: bash
        env:
          WF_ACCEPTANCE_MODE: "dual-world"
          WF_MAP_ID: "real-map"
          WF_RUNTIME_TIMEOUT_SECONDS: "3300"
        run: |
          bash tools/world-runtime-smoke.sh "$RUNNER_TEMP/maqan-world-runtime-map/real-map.worldmap" dist "$RUNNER_TEMP/maqan-dual-world-runtime"

      - name: Aggregate same-server world genesis acceptance
        if: always()
        shell: pwsh
        env:
          DUAL_WORLD_OUTCOME: ${{ steps.dual_world_smoke.outcome }}
        run: |
          "SAME_SERVER_DUAL_WORLD_OUTCOME=$env:DUAL_WORLD_OUTCOME" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($env:DUAL_WORLD_OUTCOME -ne "success") {
            throw "Same-server dual-world genesis acceptance failed; inspect the runtime artifact."
          }

      - name: Upload same-server dual-world and acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maqan-world-runtime-server-acceptance
          path: |
            ${{ runner.temp }}/maqan-dual-world-runtime/
            ${{ runner.temp }}/maqan-contour-00-server-core/\n            ${{ runner.temp }}/maqan-contour-02-population/
            ${{ runner.temp }}/maqan-contour-01-population/
            ${{ runner.temp }}/maqan-world-runtime-map/
          if-no-files-found: warn
          retention-days: 30
