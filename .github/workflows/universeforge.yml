name: MAQAN UniverseForge — Windows x64

on:
  push:
    branches: [main]
    paths:
      - "mods/**"
      - "shared/**"
      - "platform/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "mods/**"
      - "shared/**"
      - "platform/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universeforge-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  atlas:
    name: Atlas — Forge 47.4.28 + Rust (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Test Atlas native core
        working-directory: mods/atlas/native/maqan-core
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Build Atlas native core
        working-directory: mods/atlas/native/maqan-core
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Stage Windows native library
        shell: pwsh
        run: |
          $nativeDir = "mods/atlas/build/native-libs/maqan-native-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $nativeDir | Out-Null
          Copy-Item "mods/atlas/native/maqan-core/target/x86_64-pc-windows-msvc/release/maqan_core.dll" "$nativeDir/maqan_core.dll" -Force
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Build Atlas Forge mod
        working-directory: mods/atlas
        run: gradle --no-daemon clean build
      - uses: actions/upload-artifact@v4
        with:
          name: maqan-atlas-windows-x64
          path: mods/atlas/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

  worldforge-core:
    name: WorldForge core — Forge 47.3.0 (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.1.1"
      - name: Build WorldForge core
        working-directory: mods/worldforge/wfmod
        run: gradle --no-daemon clean build
      - uses: actions/upload-artifact@v4
        with:
          name: maqan-worldforge-core-windows-x64
          path: mods/worldforge/wfmod/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

  worldforge-addons:
    name: WorldForge addons (Windows x64)
    runs-on: windows-latest
    needs: worldforge-core
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.1.1"
      - name: Build core and all addons in dependency order
        working-directory: mods/worldforge/wfaddons
        shell: bash
        run: bash tools/build-all.sh ../wfmod
      - uses: actions/upload-artifact@v4
        with:
          name: maqan-worldforge-addons-windows-x64
          path: mods/worldforge/wfaddons/dist/*.jar
          if-no-files-found: error
          retention-days: 30

  worldforge-tests:
    name: WorldForge logic tests (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile and run WorldForge logic tests
        working-directory: mods/worldforge/wfaddons
        shell: bash
        run: bash tools/test-all.sh ../wfmod

  worldforge-native:
    name: WorldForge simulation native core (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Test WorldForge native core
        working-directory: mods/worldforge/native/worldforge-sim
        run: cargo test --target x86_64-pc-windows-msvc
      - name: Build WorldForge native core
        working-directory: mods/worldforge/native/worldforge-sim
        run: cargo build --release --target x86_64-pc-windows-msvc

  platform:
    name: MAQAN Platform shell (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Build Platform shell
        working-directory: platform
        run: gradle --no-daemon clean build
      - uses: actions/upload-artifact@v4
        with:
          name: maqan-platform-windows-x64
          path: platform/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
