name: Import pinned MAQAN source repositories

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maqan-source-import
  cancel-in-progress: false

jobs:
  import:
    name: Import Atlas and WorldForge snapshots
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout UniverseForge
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download and unpack private source snapshots
        shell: pwsh
        env:
          SOURCE_READ_TOKEN: ${{ secrets.MAQAN_SOURCE_READ_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:SOURCE_READ_TOKEN)) {
            throw "Missing repository secret MAQAN_SOURCE_READ_TOKEN. Add a fine-grained token with Contents: Read access to both source repositories, then run this workflow again."
          }

          $headers = @{
            Authorization = "Bearer $env:SOURCE_READ_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $sources = @(
            @{
              Name = "atlas"
              Repository = "gusilius/MAQAN-Galactic-Navigator"
              Commit = "8ba7f02abb469f035fe6c1dd56bdd647f5fd14ef"
              Destination = "mods/atlas"
            },
            @{
              Name = "worldforge"
              Repository = "gusilius/MAQAN-WorldForge"
              Commit = "f169f2ccda035eefdd259b08d4a8ba4dda48b5be"
              Destination = "mods/worldforge"
            }
          )

          foreach ($source in $sources) {
            $archive = Join-Path $env:RUNNER_TEMP "$($source.Name)-source.zip"
            $extract = Join-Path $env:RUNNER_TEMP "$($source.Name)-source"
            $uri = "https://api.github.com/repos/$($source.Repository)/zipball/$($source.Commit)"

            Write-Host "Downloading $($source.Repository) @ $($source.Commit)"
            Invoke-WebRequest -Uri $uri -Headers $headers -OutFile $archive
            Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force

            $root = Get-ChildItem -LiteralPath $extract -Directory | Select-Object -First 1
            if ($null -eq $root) { throw "Archive for $($source.Name) did not contain a repository root." }

            New-Item -ItemType Directory -Force -Path $source.Destination | Out-Null
            Get-ChildItem -LiteralPath $root.FullName -Force | ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination $source.Destination -Recurse -Force
            }
          }

      - name: Verify imported source boundaries
        shell: pwsh
        run: |
          $required = @(
            "mods/atlas/build.gradle",
            "mods/atlas/native/maqan-core/Cargo.toml",
            "mods/atlas/src/main/java/com/maqan/galacticnavigator/client/NavigatorScreen.java",
            "mods/worldforge/wfmod/build.gradle",
            "mods/worldforge/wfaddons/tools/build-all.sh",
            "mods/worldforge/native/worldforge-sim/Cargo.toml"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required migrated source file is missing: $path"
            }
          }

          $addonCount = (Get-ChildItem -LiteralPath "mods/worldforge/wfaddons" -Directory -Filter "wf-*" | Measure-Object).Count
          if ($addonCount -lt 18) { throw "Expected 18 WorldForge addons, found $addonCount." }
          Write-Host "Verified Atlas, WorldForge core, native sources and $addonCount addons."

      - name: Commit the one-time source migration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- mods/atlas mods/worldforge
          if (git diff --cached --quiet) {
            Write-Host "Pinned source snapshots are already present; no files changed."
            exit 0
          }
          git commit -m "Import pinned Atlas and WorldForge source snapshots"
          git push origin HEAD:main
