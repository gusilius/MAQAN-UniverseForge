// MAQAN UniverseForge is an ecosystem repository, not a single gameplay mod.
// Each Forge mod remains an independently buildable Gradle project.
plugins { id 'base' }

def atlasDir = file('mods/atlas')
def worldForgeDir = file('mods/worldforge')
def coreDir = file('mods/worldforge/wfmod')
def addonsDir = file('mods/worldforge/wfaddons')

tasks.register('buildAtlas', Exec) {
    group = 'maqan'
    description = 'Build the independent Atlas mod.'
    workingDir atlasDir
    commandLine 'gradle', '--no-daemon', 'build'
}
tasks.register('buildWorldForgeCore', Exec) {
    group = 'maqan'
    description = 'Build the independent WorldForge core mod.'
    workingDir coreDir
    commandLine 'gradle', '--no-daemon', 'build'
}
tasks.register('buildWorldForgeAddons', Exec) {
    group = 'maqan'
    description = 'Build WorldForge core and all addons in dependency order.'
    workingDir addonsDir
    commandLine 'bash', 'tools/build-all.sh', '../wfmod'
}
tasks.register('buildEcosystem') {
    group = 'maqan'
    description = 'Build Atlas and the complete WorldForge stack.'
    dependsOn 'buildAtlas', 'buildWorldForgeAddons'
}
tasks.register('cleanEcosystem') {
    group = 'maqan'
    description = 'Clean all independent mod builds.'
    doLast {
        [atlasDir, coreDir].each { dir ->
            delete new File(dir, 'build')
        }
        fileTree(addonsDir).matching { include 'wf-*/build/**' }.files.each { delete it }
        delete new File(addonsDir, 'dist')
    }
}
